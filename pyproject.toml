[project]
name = "jev-rerank"
version = "0.1.0"
description = "Use Jev (TypeSafe's System One model) as a calibrated reranker: one call, up to 30 documents, a probability per document."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.6", "pyyaml>=6"]

[project.optional-dependencies]
examples = ["rank-bm25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_rerank"]
